mybatis-plus:
  global-config:
    db-config:
      table-prefix: tb_
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

project:
  encryptor:
    key: 1234567890abcdef
    iv: abcdef1234567890
  captcha:
    width: 160
    height: 60
    code-count: 4
    circle-count: 0
    expire-seconds: 300
  web:
    interceptor:
      exclude-paths:
        - /swagger-ui.html
        - /swagger-ui/**
        - /v3/api-docs/**
    request-security:
      enabled: true
      check-timestamp: true
      check-request-id-repeat: true
      timestamp-tolerance-millis: 300000
      request-id-expire-seconds: 600
  file:
    endpoint: http://minio:9000
    region: global
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: iam-icon
    path-style-access-enabled: true
    public-url-prefix: ""
  log:
    path: ${PROJECT_LOG_PATH:./logs}
    max-history: ${PROJECT_LOG_MAX_HISTORY:30}

logging:
  level:
